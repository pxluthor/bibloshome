services:
  db:
    image: mysql:8.4
    container_name: bibloshome-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-bibloshome}
      MYSQL_USER: ${DB_USER:-bibloshome}
      MYSQL_PASSWORD: ${DB_PASSWORD:-bibloshome}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${DB_ROOT_PASSWORD:-root} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: bibloshome-backend
    restart: unless-stopped
    environment:
      # SQLModel / FastAPI
      DATABASE_URL: mysql+mysqlconnector://${DB_USER:-bibloshome}:${DB_PASSWORD:-bibloshome}@db:3306/${DB_NAME:-bibloshome}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      # mysql.connector (admin_bd_routes)
      HOST: db
      USER: ${DB_USER:-bibloshome}
      PASSWORD: ${DB_PASSWORD:-bibloshome}
      DATABASE: ${DB_NAME:-bibloshome}
      # Biblioteca
      PDF_SOURCE_DIR: /data/biblioteca
      PASTA_BIBLIOTECA: /data/biblioteca
      FOR_INSERT_DIR: /data/for_insert
    ports:
      - "8001:8001"
    volumes:
      - ${BIBLIOTECA_HOST_DIR:-E:\BIBLIOTECA}:/data/biblioteca:rw
      - ${FOR_INSERT_HOST_DIR:-E:\for_insert}:/data/for_insert:rw
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api-library.pxluthor.com.br}
    container_name: bibloshome-frontend
    restart: unless-stopped
    ports:
      - "5171:80"
    depends_on:
      - backend

volumes:
  mysql_data:
