services:
  db:
    image: mysql:8.4
    container_name: bibloshome-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bibloshome
      MYSQL_USER: bibloshome
      MYSQL_PASSWORD: bibloshome
      MYSQL_ROOT_PASSWORD: root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: bibloshome-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+mysqlconnector://bibloshome:bibloshome@db:3306/bibloshome
      PDF_SOURCE_DIR: /data/pdfs
      SECRET_KEY: change-me-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    ports:
      - "8001:8001"
    volumes:
      - ./data/pdfs:/data/pdfs
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8001
    container_name: bibloshome-frontend
    restart: unless-stopped
    ports:
      - "5171:80"
    depends_on:
      - backend

volumes:
  mysql_data:
