services:
  backend:
    build:
      context: ./backend
    container_name: bibloshome-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${LOCAL_DATABASE_URL:-mysql+mysqlconnector://${LOCAL_DB_USER:-root}:${LOCAL_DB_PASSWORD:-root}@host.docker.internal:${LOCAL_DB_PORT:-3306}/${LOCAL_DB_NAME:-bibloshome}}
      PDF_SOURCE_DIR: /data/pdfs
      PDF_SOURCE_PREFIX: ${PDF_SOURCE_PREFIX:-E:\BIBLIOTECA}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    ports:
      - "8001:8001"
    volumes:
      - ${PDF_HOST_DIR:-E:\BIBLIOTECA}:/data/pdfs:ro

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8001
    container_name: bibloshome-frontend
    restart: unless-stopped
    ports:
      - "5171:80"
    depends_on:
      - backend
