services:
  backend:
    build:
      context: ./backend
    container_name: bibloshome-backend
    restart: unless-stopped
    environment:
      # SQLModel / FastAPI — conecta ao MySQL do host
      DATABASE_URL: mysql+mysqlconnector://${LOCAL_DB_USER:-root}:${LOCAL_DB_PASSWORD:-root}@host.docker.internal:${LOCAL_DB_PORT:-3306}/${LOCAL_DB_NAME:-bibloshome}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      # mysql.connector (admin_bd_routes) — mesmo host
      HOST: host.docker.internal
      USER: ${LOCAL_DB_USER:-root}
      PASSWORD: ${LOCAL_DB_PASSWORD:-root}
      DATABASE: ${LOCAL_DB_NAME:-bibloshome}
      # Biblioteca
      PDF_SOURCE_DIR: /data/biblioteca
      PASTA_BIBLIOTECA: /data/biblioteca
      FOR_INSERT_DIR: /data/for_insert
      # IA / AI
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_DEFAULT_CHAT_MODEL: ${OLLAMA_DEFAULT_CHAT_MODEL:-llama3.1:8b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHROMA_DIR: /data/chromadb
    ports:
      - "8001:8001"
    volumes:
      - ${BIBLIOTECA_HOST_DIR:-E:\BIBLIOTECA}:/data/biblioteca:rw
      - ${FOR_INSERT_HOST_DIR:-E:\for_insert}:/data/for_insert:rw
      - ${CHROMA_HOST_DIR:-E:\bibloshome_chromadb}:/data/chromadb:rw

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api-library.pxluthor.com.br}
    container_name: bibloshome-frontend
    restart: unless-stopped
    ports:
      - "5171:80"
    depends_on:
      - backend
